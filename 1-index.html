<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheat Sheet Index</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #52616b;
      --line: #d7dee4;
      --blue: #0b67b2;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 13px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px;
    }

    header {
      margin-bottom: 6px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    h2.stage {
      margin: 20px 0 2px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    ul.sheets {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.sheets li + li {
      border-top: 1px solid var(--line);
    }

    ul.sheets a {
      display: block;
      padding: 12px 2px;
      color: var(--blue);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    ul.sheets a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Cheat Sheet Index</h1>
      <div class="subtitle">A small, printable collection for quick revision.</div>
    </header>

    <h2 class="stage">Coding round</h2>
    <ul class="sheets">
      <li><a href="python-dsa-data-structures-cheatsheet.html">Python DSA</a></li>
      <li><a href="numpy-basics-cheatsheet.html">NumPy</a></li>
    </ul>
    <h2 class="stage">ML fundamentals</h2>
    <ul class="sheets">
      <li><a href="probability-cheatsheet.html">Probability</a></li>
      <li><a href="ml-optimizers-cheatsheet.html">ML Optimizers</a></li>
      <li><a href="ml-losses-cheatsheet.html">ML Losses</a></li>
    </ul>
    <h2 class="stage">Deep learning</h2>
    <ul class="sheets">
      <li><a href="pytorch-cheatsheet.html">PyTorch</a></li>
      <li><a href="yolo-architecture-cheatsheet.html">YOLO Architecture</a></li>
    </ul>
    <h2 class="stage">System design round</h2>
    <ul class="sheets">
      <li><a href="system-design-cheatsheet.html">System Design</a></li>
    </ul>
  </main>
</body>
</html>
